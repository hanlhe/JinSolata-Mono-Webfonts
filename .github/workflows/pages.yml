name: Publish webfonts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "JinSolataMono.css"
      - "*.woff2"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage webfonts and preview
        run: |
          mkdir -p _site
          cp JinSolataMono.css JinSolataMono-{Light,Regular,Bold}.woff2 index.html _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
